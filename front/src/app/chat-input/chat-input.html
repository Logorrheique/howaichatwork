<div class="flex flex-col gap-4 pt-[200px]">
    <h1 class="text-5xl font-bold text-center pt-10">How AI chat Work ?</h1>
    <hlm-field class="px-[300px]" orientation="horizontal">

        <input #promptArea hlmInput type="search" placeholder="Type Something..." [disabled]="chatApi.loading()"
            (keyup.enter)="chatApi.getResultOfPrompt(promptArea.value)" />

        @if (chatApi.loading()) {
        <button hlmBtn variant="outline" type="button" (click)="chatApi.stop()">Stop</button>
        } @else {
        <button hlmBtn type="button" (click)="chatApi.getResultOfPrompt(promptArea.value)">
            Search
        </button>
        }
    </hlm-field>
    <ul class="flex flex-col gap-2 p-[100px]">
        @for (message of chatApi.messages(); track $index) {
        <li [class]="message.role === 'user' ? 'text-right' : 'text-left'">
            <strong>{{ message.role.toUpperCase() }}</strong> : {{ message.content }}
        </li>
        } @empty {
        <li>Parlez moi !</li>
        }
    </ul>

    @if (chatApi.error()) {
    <p class="text-sm text-red-600">{{ chatApi.error() }}</p>
    }
</div>
